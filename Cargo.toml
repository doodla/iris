[package]
name = "iris"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Generate and edit images and generate videos through OpenAI and Google Gemini/Veo from one agent-friendly CLI"
license = "MIT"
repository = "https://github.com/doodla/iris"
readme = "README.md"
keywords = ["cli", "image-generation", "video-generation", "openai", "gemini"]
categories = ["command-line-utilities", "multimedia"]
include = [
    "/src/**",
    "/schema/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[[bin]]
name = "iris"
path = "src/main.rs"

[lib]
name = "iris"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
fastrand = "2.5.0"
futures-util = "0.3.34"
jiff = { version = "0.2.37", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "http2", "system-proxy", "json", "multipart", "stream"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "signal", "fs", "io-util"] }
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
