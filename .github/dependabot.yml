# Dependency update automation (SPEC §12).
#
# Two ecosystems, both weekly, both grouped so routine minor/patch bumps land
# as one PR instead of one-per-crate. Security *alerts* for cargo come from
# GitHub's advisory scanning; the CI `deny` job (cargo-deny) is the actual
# vulnerability gate for cargo dependencies. Actions are SHA-pinned with a
# trailing `# vX.Y.Z` comment (see ci.yml/release.yml); Dependabot has kept
# both the SHA and the comment in sync since 2022, which is what makes
# SHA-pinning practical to maintain here.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
