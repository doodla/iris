# Release: check, build, package, smoke-test, and publish the release
# archives (docs/install.md) for a pushed `vX.Y.Z` tag (or, via
# workflow_dispatch, everything but publishing — see the `dry_run` input
# below). Publishing needs every other job to pass on the tagged commit.
#
# Runtime compatibility of the three published archives (documented here so
# this workflow's claims about what each archive runs on match
# docs/install.md):
#   - iris-vX.Y.Z-x86_64-unknown-linux-musl.tar.gz: statically linked
#     (musl libc, static-pie) — runs on any x86_64 Linux kernel >= 3.2,
#     regardless of the host's glibc version or absence of one.
#   - iris-vX.Y.Z-x86_64-apple-darwin.tar.gz: macOS 10.12+ (Sierra and
#     later) — rustc's documented default deployment target for this
#     triple (https://doc.rust-lang.org/nightly/rustc/platform-support.html,
#     checked 2026-09-24); not overridden here via MACOSX_DEPLOYMENT_TARGET.
#   - iris-vX.Y.Z-aarch64-apple-darwin.tar.gz: macOS 11.0+ (Big Sur and
#     later) — same source; also the first macOS version Apple Silicon
#     Macs shipped with, so this is not a practical additional restriction.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Build and smoke-test every target without publishing. This is the
          only thing workflow_dispatch ever does: the publish job below only
          runs for an actual `push` of a `v*` tag, regardless of this input.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          # github.event_name is not attacker-controlled, but routing every
          # templated value through env: rather than inline `${{ }}`
          # interpolation is the hardening GitHub itself recommends: it
          # keeps expression values out of the literal script text that
          # bash parses, so nothing here can be reached by a script-
          # injection payload smuggled through a future `${{ }}` addition.
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            version=$(sh scripts/check-tag-version.sh "$tag")
          else
            tag=""
            version=$(sh scripts/check-tag-version.sh)
            echo "::notice::workflow_dispatch dry run, no tag pushed; using Cargo.toml version $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  checks:
    name: checks
    # The same format, lint and test gates as CI, run again on the tagged
    # commit itself: a tag can point at a commit CI never passed.
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: build (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # The three v1 release targets, each on its native runner: musl
          # gives portable static Linux binaries, and native macOS runners
          # cover the two Apple targets. macos_deployment_target pins
          # MACOSX_DEPLOYMENT_TARGET to the exact floor documented in the
          # header comment above; without it, the real minimum is whatever
          # rustc/cc default to today, which a future toolchain or a C
          # dependency's build script (e.g. aws-lc-sys) could silently
          # raise without this workflow noticing.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            macos_deployment_target: ""
          - target: x86_64-apple-darwin
            os: macos-15-intel
            macos_deployment_target: "10.12"
          - target: aarch64-apple-darwin
            os: macos-15
            macos_deployment_target: "11.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: cargo build --release
        env:
          # Empty string on the Linux/musl leg is a no-op: this variable is
          # only consulted by Apple's linker/toolchain.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive
        run: sh scripts/package-release.sh ${{ matrix.target }} dist

      - name: Smoke-test the archive and install.sh with it
        env:
          # Routed through env: rather than inline `${{ }}` interpolation
          # (GitHub's own script-injection hardening guidance) — see the
          # `verify` job's `check` step for why.
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        # Runs the packaged binary, then installs the archive with install.sh
        # from a server on 127.0.0.1 (see the script). The build step saw
        # GITHUB_SHA, so the binary must report it as version.git_commit.
        run: EXPECTED_GIT_COMMIT="$GITHUB_SHA" sh scripts/smoke-test-release.sh "$VERSION" "$TARGET" dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: [verify, checks, build]
    # Only an actual tag push publishes. workflow_dispatch (any input value)
    # and pull_request never reach here.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Assert expected archives and build SHA256SUMS
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          ls -l

          # Fail closed rather than publishing whatever happened to match
          # dist/*.tar.gz: require exactly the three release archives (see
          # docs/install.md) for this version, and nothing else, before
          # anyone downloads them.
          expected=$(printf '%s\n' \
            "iris-v${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            "iris-v${VERSION}-x86_64-apple-darwin.tar.gz" \
            "iris-v${VERSION}-aarch64-apple-darwin.tar.gz" | LC_ALL=C sort)
          actual=$(find . -maxdepth 1 -type f -name '*.tar.gz' -printf '%f\n' | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::unexpected set of release archives"
            echo "--- expected ---"
            echo "$expected"
            echo "--- got ---"
            echo "$actual"
            exit 1
          fi

          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        env:
          # github.token (equivalent to secrets.GITHUB_TOKEN, but not routed
          # through the secrets context, which these workflows never
          # reference) and the tag, both via env: rather than inline `${{ }}`
          # interpolation (GitHub's own script-injection hardening guidance).
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          args=(dist/*.tar.gz dist/SHA256SUMS install.sh --title "$TAG" --generate-notes)
          case "$TAG" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$TAG" "${args[@]}"
