# Weekly dependency check: the same `cargo deny check` as CI's deny job, on a
# schedule, so an advisory published against an unchanged Cargo.lock is
# reported without waiting for the next push. In a public repository with no
# activity for 60 days, GitHub disables scheduled workflows; re-enable this
# one from the Actions tab, or run it by hand (workflow_dispatch).
name: Advisories

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: deny
    # EmbarkStudios/cargo-deny-action is a Docker container action: Linux
    # GitHub-hosted runners only.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # Same as ci.yml: no `--all-features` (the action's default), so
          # this checks the graph a plain `cargo deny check` checks.
          arguments: ""
