name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - run: cargo test --locked

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          # Keep this literal in sync with `rust-version` in Cargo.toml.
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - name: cargo check (MSRV)
        run: cargo check --locked --all-targets
      - name: cargo test (MSRV, tests must build on MSRV too)
        run: cargo test --locked

  deny:
    name: deny
    # EmbarkStudios/cargo-deny-action is a Docker container action: Linux
    # GitHub-hosted runners only (see evidence/T-08/sha-verification.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          command: check
          # The action's own default `arguments` is "--all-features", which
          # would silently check a different dependency graph than the
          # plain `cargo deny check` validated locally (evidence/T-08).
          # Iris's Cargo.toml has no [features] table, so this happens not
          # to matter today, but pin it explicitly rather than rely on that.
          arguments: ""

  installer:
    name: installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: shellcheck
      # install.sh and tests/installer/run.sh are owned and written by a
      # separate task; referenced here by path only.
      - run: shellcheck -s sh install.sh
      - run: sh tests/installer/run.sh

  package-check:
    name: package-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: stable
      - name: cargo package --list
        run: cargo package --list --locked | tee package-list.txt
      - name: Assert package contains only intended files
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              # .cargo_vcs_info.json is generated by Cargo itself (records
              # the git commit the package was built from) whenever
              # `cargo package` runs against a clean git checkout without
              # --allow-dirty, verified locally (evidence/T-08); it is not
              # one of our own source files but is expected here.
              src/*|schema/*|Cargo.*|README.md|LICENSE|CHANGELOG.md|.cargo_vcs_info.json)
                ;;
              *)
                echo "::error::unexpected file in package: $f"
                status=1
                ;;
            esac
          done < package-list.txt
          exit "$status"
