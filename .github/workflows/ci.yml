name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          # Keep this literal in sync with `rust-version` in Cargo.toml.
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check (MSRV)
        run: cargo check --locked --all-targets
      - name: cargo test (MSRV, tests must build on MSRV too)
        run: cargo test --locked

  deny:
    name: deny
    # EmbarkStudios/cargo-deny-action is a Docker container action: Linux
    # GitHub-hosted runners only.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # The action's own default `arguments` is "--all-features", which
          # would silently check a different dependency graph than the
          # plain `cargo deny check` validated locally.
          # Iris's Cargo.toml has no [features] table, so this happens not
          # to matter today, but pin it explicitly rather than rely on that.
          arguments: ""

  installer:
    name: installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: shellcheck
      # Offline installer tests: fixtures served from 127.0.0.1 only.
      - run: shellcheck -s sh install.sh
      - run: sh tests/installer/run.sh

  package-check:
    name: package-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: stable
      - name: cargo package --list
        # Without an explicit `shell:`, GitHub runs run: steps on Linux as
        # `bash -e {0}` (no pipefail) — the *plain* bash default, which
        # differs from what `shell: bash` gets you. Under `-e` alone, a
        # failing `cargo package` in this pipe would be masked by `tee`'s
        # own success and the step would report a wrong (empty) exit code
        # 0. `set -o pipefail` here makes the pipe reflect cargo's exit
        # status regardless of how the step is invoked (verified locally,
        # not just in principle).
        run: |
          set -euo pipefail
          cargo package --list --locked | tee package-list.txt
      - name: Assert package contains only intended files
        run: |
          set -euo pipefail
          if [ ! -s package-list.txt ]; then
            echo "::error::package-list.txt is empty; cargo package --list produced no output"
            exit 1
          fi
          status=0
          for required in Cargo.toml src/main.rs LICENSE README.md; do
            if ! grep -qxF "$required" package-list.txt; then
              echo "::error::expected file missing from package: $required"
              status=1
            fi
          done
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              # .cargo_vcs_info.json is generated by Cargo itself (records
              # the git commit the package was built from) whenever
              # `cargo package` runs against a clean git checkout without
              # --allow-dirty, verified locally; it is not
              # one of our own source files but is expected here.
              src/*|schema/*|Cargo.*|README.md|LICENSE|CHANGELOG.md|.cargo_vcs_info.json)
                ;;
              *)
                echo "::error::unexpected file in package: $f"
                status=1
                ;;
            esac
          done < package-list.txt
          exit "$status"
