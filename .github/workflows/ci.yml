name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes its older runs. Every other run
# (pushes to main, manual runs) gets a group of its own, so it is neither
# cancelled nor, as a pending run in a shared group would be, replaced by a
# later one: a release may only be tagged from a main commit whose CI passed
# (docs/contributing/releasing.md).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked
        env:
          # Name the checked-out commit, as release builds do, so the version
          # test covers a binary that reports one. The msrv job leaves it
          # unset, so there the same test covers a build with only
          # GITHUB_SHA set, which must report null.
          IRIS_GIT_COMMIT: ${{ github.sha }}

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain is `rust-version` from Cargo.toml itself, so the declared
      # minimum and the one tested cannot drift apart.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version=$(awk '
            /^\[package\]/ { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && /^[[:space:]]*rust-version[[:space:]]*=/ {
              line = $0
              sub(/^[^"]*"/, "", line)
              sub(/".*$/, "", line)
              print line
              exit
            }
          ' Cargo.toml)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::could not read package.rust-version from Cargo.toml (got '$version')"
            exit 1
          fi
          echo "MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check (MSRV)
        run: cargo check --locked --all-targets
      - name: cargo test (MSRV, tests must build on MSRV too)
        run: cargo test --locked

  deny:
    name: deny
    # EmbarkStudios/cargo-deny-action is a Docker container action: Linux
    # GitHub-hosted runners only.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # The action's default `arguments` is "--all-features". Pass none,
          # so CI checks the same dependency graph as a plain `cargo deny
          # check` (and deny.toml's [graph] settings), also once the crate
          # gains optional features.
          arguments: ""

  installer:
    name: installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: shellcheck
      # With busybox installed, the BusyBox wget cases run on real BusyBox
      # applets (as on Alpine); elsewhere a shim gives GNU wget BusyBox's exit
      # codes.
      - name: Install BusyBox
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y busybox-static
      # Offline installer tests: fixtures served from 127.0.0.1 only.
      - run: shellcheck -s sh install.sh
      - run: shellcheck scripts/*.sh tests/installer/*.sh tests/live/*.sh
      - run: sh tests/installer/run.sh

  live-verify-mock:
    name: live-verify.sh (offline mock)
    # scripts/live-verify.sh is the opt-in, paid live verification, which CI
    # never runs. This checks the script itself for free: its --plan (dry runs
    # only) and a full run in its mock mode against a mock of both APIs on
    # 127.0.0.1 (tests/live/mock-run.sh), which runs every live-verify.sh under
    # env -i with fake keys. No key is ever set: the step also unsets both.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked
      - name: live-verify.sh --plan and mock mode, offline
        run: env -u OPENAI_API_KEY -u GEMINI_API_KEY sh tests/live/mock-run.sh target/debug/iris

  release-dry-run:
    name: release dry run (x86_64-unknown-linux-musl)
    # The Linux leg of release.yml without publishing, so the release-only
    # paths (musl build, packaging, the smoke test of the archive and of
    # install.sh with it) are exercised before anything is tagged, with the
    # same pinned toolchain the release uses (read from release.yml, so the
    # two never drift). The macOS legs run only in release.yml;
    # docs/contributing/releasing.md asks for a manual dry run of it before
    # tagging.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned release toolchain from release.yml
        run: |
          set -eu
          version=$(sed -n 's/^  RELEASE_RUST_TOOLCHAIN: "\([0-9.]*\)"$/\1/p' .github/workflows/release.yml)
          if [ -z "$version" ]; then
            echo "::error::no RELEASE_RUST_TOOLCHAIN found in .github/workflows/release.yml"
            exit 1
          fi
          echo "RELEASE_RUST_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: ${{ env.RELEASE_RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-musl
          components: clippy
      - name: Check the release toolchain
        run: sh scripts/check-release-toolchain.sh "$RELEASE_RUST_TOOLCHAIN"
      - name: Clippy with the release toolchain
        run: cargo clippy --all-targets --locked -- -D warnings
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install musl toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
        env:
          # The commit checked out above, reported as version.git_commit, as
          # in a release build.
          IRIS_GIT_COMMIT: ${{ github.sha }}
      - name: Install cargo-about (generates THIRD-PARTY-LICENSES)
        # The exact version scripts/package-release.sh requires.
        run: cargo install --locked --features cli cargo-about@0.9.2
      - name: Package twice; the archives must be identical
        run: |
          set -euo pipefail
          first=$(sh scripts/package-release.sh x86_64-unknown-linux-musl dist)
          second=$(sh scripts/package-release.sh x86_64-unknown-linux-musl dist-again)
          cmp "$first" "$second"
      - name: Smoke-test the archive and install.sh with it
        run: |
          set -euo pipefail
          version=$(sh scripts/check-tag-version.sh)
          # The build above named this commit, so the binary must report it.
          EXPECTED_GIT_COMMIT="$GITHUB_SHA" \
            sh scripts/smoke-test-release.sh "$version" x86_64-unknown-linux-musl dist

  package-check:
    name: package-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-11)
        with:
          toolchain: stable
      - name: cargo package --list
        # Without an explicit `shell:`, GitHub runs run: steps on Linux as
        # `bash -e {0}` (no pipefail), which differs from what `shell: bash`
        # gets you. Under `-e` alone, a failing `cargo package` in this pipe
        # would be masked by `tee`'s own success and the step would pass
        # with an empty list. `set -o pipefail` makes the pipe fail when
        # cargo fails, however the step is invoked.
        run: |
          set -euo pipefail
          cargo package --list --locked | tee package-list.txt
      - name: Assert package contains only intended files
        run: |
          set -euo pipefail
          if [ ! -s package-list.txt ]; then
            echo "::error::package-list.txt is empty; cargo package --list produced no output"
            exit 1
          fi
          status=0
          for required in Cargo.toml build.rs src/main.rs LICENSE README.md; do
            if ! grep -qxF "$required" package-list.txt; then
              echo "::error::expected file missing from package: $required"
              status=1
            fi
          done
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              # .cargo_vcs_info.json is generated by Cargo itself (it
              # records the git commit the package was built from) whenever
              # `cargo package` runs in a clean git checkout without
              # --allow-dirty; it is not one of our source files but is
              # expected here. Keep this list in step with
              # `package.include` in Cargo.toml.
              src/*|schema/*|build.rs|Cargo.*|README.md|LICENSE|CHANGELOG.md|.cargo_vcs_info.json)
                ;;
              *)
                echo "::error::unexpected file in package: $f"
                status=1
                ;;
            esac
          done < package-list.txt
          exit "$status"
