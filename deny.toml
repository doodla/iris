# cargo-deny configuration for Iris.
#
# Run locally with: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# This file intentionally stays small: only the sections and fields Iris
# actually needs are set explicitly; everything else keeps cargo-deny's
# documented default (see `cargo deny init` for the fully-commented template).

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []
# Shell out to the system `git` binary to update the advisory-db clone
# instead of cargo-deny's embedded git library. This is the documented
# workaround for networks/proxies that terminate TLS in a way the embedded
# library doesn't trust (that's what happened during local validation for
# this task: the embedded fetcher failed the TLS handshake while the system
# `git` CLI succeeded against the same host — see evidence/T-08/local-vs-hosted.md)
# and is a no-op cost elsewhere.
git-fetch-with-cli = true

[licenses]
version = 2
# MIT distribution (SPEC §2/§12): every allowed license here must be
# compatible with re-distributing Iris under MIT. Kept to exactly what the
# current dependency tree needs (verified with `cargo deny check licenses`),
# no copyleft.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Needed transitively: rustls-platform-verifier -> webpki-root-certs.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # option-ext (pulled in transitively by the platform-directories crate) is
    # MPL-2.0, a file-level copyleft license: modifying option-ext's own
    # source and redistributing it would require sharing those changes, but
    # merely depending on it does not affect Iris's own MIT licensing. Scoped
    # to this one crate only, not a blanket MPL-2.0 allow. (decisions.md D-11)
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
